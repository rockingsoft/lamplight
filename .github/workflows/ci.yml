name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run unit tests
        run: make deps fmt-check test

  quality:
    name: Static and race checks
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run static and race checks
        run: make vet lint test-race

  k6-e2e:
    name: E2E (k6)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up k6
        uses: grafana/setup-k6-action@v1
        with:
          k6-version: '1.8.0'

      - name: Run Lamplight k6 E2E
        run: |
          go build -o "$RUNNER_TEMP/lamplight" ./cmd/lamplight
          "$RUNNER_TEMP/lamplight" run \
            --working-dir testdata/k6-e2e \
            --json-file "$RUNNER_TEMP/k6-e2e-result.json"
          cat "$RUNNER_TEMP/k6-e2e-result.json"

  e2e:
    name: E2E (${{ matrix.runtime }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: compose
            config: compose.lamplight
          - runtime: k3s
            config: k3s.lamplight
    steps:
      - name: Check out Lamplight
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check out Pokeshop
        uses: actions/checkout@v7
        with:
          repository: rockingsoft/pokeshop
          path: pokeshop

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up kubectl
        if: matrix.runtime == 'k3s'
        uses: azure/setup-kubectl@v5
        with:
          version: v1.35.5

      - name: Build matching CLI and executor image
        env:
          VERSION: 0.0.0-e2e-${{ github.sha }}
        run: |
          set -eu
          bin_dir="$RUNNER_TEMP/lamplight-bin"
          image_context="$RUNNER_TEMP/lamplight-image"
          arch="$(go env GOARCH)"
          mkdir -p "$bin_dir" "$image_context/linux/$arch"
          CGO_ENABLED=0 go build \
            -trimpath \
            -ldflags "-s -w -X lamplight/internal/buildinfo.Version=$VERSION" \
            -o "$bin_dir/lamplight" \
            ./cmd/lamplight
          install -m 0755 "$bin_dir/lamplight" "$image_context/linux/$arch/lamplight"
          install -m 0644 Dockerfile "$image_context/Dockerfile"
          docker build \
            --build-arg "TARGETPLATFORM=linux/$arch" \
            --tag "ghcr.io/rockingsoft/lamplight:$VERSION" \
            "$image_context"
          echo "$bin_dir" >> "$GITHUB_PATH"

      - name: Start target fixture
        working-directory: pokeshop
        env:
          RUNTIME: ${{ matrix.runtime }}
        run: |
          if [ "$RUNTIME" = k3s ]; then
            make k3s
            ./.bin/k3d image import --cluster pokeshop "ghcr.io/rockingsoft/lamplight:0.0.0-e2e-${GITHUB_SHA}"
          else
            make run
          fi

      - name: Run Lamplight E2E suite
        working-directory: pokeshop
        env:
          KUBECONFIG: ${{ github.workspace }}/pokeshop/.bin/kubeconfig-pokeshop.yaml
        run: |
          set -euo pipefail
          test_status=0
          lamplight --verbose run --target ${{ matrix.runtime }} --workers 10 --json-file lamplight-result.json 2>lamplight-debug.log || test_status=$?
          cat lamplight-result.json
          (( test_status == 0 )) || exit "$test_status"

          slow_sent=0
          fast_sent=0
          fast_received=0
          slow_received=0
          line_number=0
          while IFS= read -r line; do
            line_number=$((line_number + 1))
            if [[ $line == *'msg="executor request sent"'* && $line == *'/pokemon/slow'* ]]; then
              slow_sent=$line_number
            elif [[ $line == *'msg="executor request sent"'* && $line == *'/pokemon/healthcheck'* ]]; then
              fast_sent=$line_number
            elif [[ $line == *'msg="executor response received"'* && $line == *'/pokemon/healthcheck'* ]]; then
              fast_received=$line_number
            elif [[ $line == *'msg="executor response received"'* && $line == *'/pokemon/slow'* ]]; then
              slow_received=$line_number
            fi
          done < lamplight-debug.log

          if (( slow_sent == 0 || fast_sent == 0 || fast_received == 0 || slow_received == 0 ||
                slow_sent >= fast_sent || fast_sent >= fast_received || fast_received >= slow_received )); then
            printf 'Remote request order failed: slow sent=%d, fast sent=%d, fast received=%d, slow received=%d\n' \
              "$slow_sent" "$fast_sent" "$fast_received" "$slow_received" >&2
            exit 1
          fi
          printf 'Remote request order verified: slow sent=%d, fast sent=%d, fast received=%d, slow received=%d\n' \
            "$slow_sent" "$fast_sent" "$fast_received" "$slow_received"

      - name: Run local trigger with remote collector E2E
        working-directory: pokeshop
        env:
          KUBECONFIG: ${{ github.workspace }}/pokeshop/.bin/kubeconfig-pokeshop.yaml
        run: |
          cp ../testdata/remote-collector-local-e2e/${{ matrix.config }} .lamplight-local-collector-e2e
          lamplight run --config .lamplight-local-collector-e2e --target local_collector_e2e \
            --json-file lamplight-local-collector-result.json
          cat lamplight-local-collector-result.json

      - name: Clean up Pokeshop
        if: always()
        working-directory: pokeshop
        run: make clean
