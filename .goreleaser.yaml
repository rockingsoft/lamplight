# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: lamplight

builds:
  - id: lamplight
    main: ./cmd/lamplight
    binary: lamplight
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X lamplight/internal/buildinfo.Version={{ .Version }}
  - id: lamplight-k6-cloud-run
    main: ./cmd/lamplight-k6-cloud-run
    binary: lamplight-k6-cloud-run
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w

dockers_v2:
  - id: lamplight
    ids:
      - lamplight
    dockerfile: Dockerfile
    images:
      - ghcr.io/rockingsoft/lamplight
    tags:
      - "{{ .Version }}"
    platforms:
      - linux/amd64
      - linux/arm64
  - id: lamplight-k6-cloud-run
    ids:
      - lamplight-k6-cloud-run
    dockerfile: Dockerfile.k6-cloud-run
    images:
      - ghcr.io/rockingsoft/lamplight-k6-cloud-run
    tags:
      - "{{ .Version }}"
    platforms:
      - linux/amd64
      - linux/arm64

archives:
  - id: lamplight
    ids:
      - lamplight
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
  - id: lamplight-k6-cloud-run
    ids:
      - lamplight-k6-cloud-run
    formats:
      - binary

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - '^ci:'
      - '^Merge '

release:
  draft: false
  prerelease: auto
